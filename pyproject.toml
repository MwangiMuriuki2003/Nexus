[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-desktop"
version = "0.1.0"
description = "An always-on, local-first personal AI assistant using NVIDIA Nemotron models."
readme = "README.MD"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "llama-cpp-python>=0.2.90",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "openai>=1.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "keyring>=25.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
cuda = ["llama-cpp-python[cuda]"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.0"]

[project.scripts]
nexus = "Nexus.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
